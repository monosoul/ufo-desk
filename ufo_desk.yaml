esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp8266:
  board: nodemcuv2

# Enable logging
logger:
  hardware_uart: UART1

#
# Wireless stuff and Home Assistant API
# Uncomment to enable.
#
 
api:
  encryption:
    key: !secret api_encryption_key
 
ota:
  - platform: esphome
    password: !secret ota_password
 
wifi:
  ssid: !secret wifi_name
  password: !secret wifi_pwd
 
# Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:
 
###########################

external_components:
  - source: components
    components: [ ufo_desk ]

ufo_desk:
  id: the_desk
  on_desk_event:
    # Any desk activity keeps the screen awake (cheap: just a timestamp,
    # plus an instant wake if it was off). No I2C work per event.
    - lambda: |-
        id(last_activity_ms) = millis();
        if (!id(display_is_on)) {
          id(display_is_on) = true;
          id(desk_display).turn_on();
        }
    - lambda: |-
        const std::array all_switches = {
          id(switch_up),
          id(switch_down),
        };
        if (x.type == ufo_desk::UfoDeskEventType::curHeightChanged) {
          id(sensor_desk_height).publish_state(x.desk.cur_height_mm());
        } else if (x.type == ufo_desk::UfoDeskEventType::errorChanged) {
          id(tsensor_error).publish_state(str_sprintf("E%02d", x.desk.error_code()));
        } else if (x.type == ufo_desk::UfoDeskEventType::positionStatusChanged) {
          id(tsensor_status).publish_state(x.desk.position_status_str());
          if (x.desk.position_status() != ufo_desk::PositionStatus::movingSlow &&
              x.desk.position_status() != ufo_desk::PositionStatus::movingFast) {
            id(switch_up).turn_off();
            id(switch_down).turn_off();
          }
        } else if (x.type == ufo_desk::UfoDeskEventType::btnStateChanged) {
          auto b = x.desk.pushed_button();
          if (b == ufo_desk::Button::up) {
            ufo_desk::exclusive_turn_on(id(switch_up), all_switches);
          } else if (b == ufo_desk::Button::down) {
            ufo_desk::exclusive_turn_on(id(switch_down), all_switches);
          } else if (b == ufo_desk::Button::none) {
            ufo_desk::exclusive_turn_on((template_::TemplateSwitch*)nullptr, all_switches);
          }
        }
        id(desk_display).update();

#
# Display auto-dim: turn the screen off after an (HA-configurable) idle
# timeout, wake it on any button press or desk activity.
#
# Design note: the activity handlers above only write a timestamp; this
# single 1s interval decides on/off and only issues an I2C command on the
# actual state transition. That keeps it non-blocking and immune to the
# high-frequency on_desk_event storm.
#

globals:
  - id: last_activity_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: display_is_on
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: calibrating
    type: bool
    restore_value: no
    initial_value: 'false'

number:
  - platform: template
    name: Display dim timeout
    id: dim_timeout
    unit_of_measurement: s
    min_value: 1
    max_value: 300
    step: 1
    initial_value: 10
    restore_value: true
    optimistic: true

interval:
  - interval: 1s
    then:
      - lambda: |-
          float ts = id(dim_timeout).state;
          uint32_t timeout_ms = (ts > 0.0f) ? (uint32_t) (ts * 1000.0f) : 10000;
          bool should_be_on = (millis() - id(last_activity_ms)) < timeout_ms;
          if (should_be_on != id(display_is_on)) {
            id(display_is_on) = should_be_on;
            if (should_be_on) {
              id(desk_display).turn_on();
            } else {
              id(desk_display).turn_off();
            }
          }

sensor:
  - platform: template
    id: sensor_desk_height
    name: Desk height
    accuracy_decimals: 0
    unit_of_measurement: mm
    icon: mdi:ruler

text_sensor:
  - platform: template
    id: tsensor_error
    name: Error
    icon: mdi:bug
  - platform: template
    id: tsensor_status
    name: Status

switch:
  - platform: template
    id: switch_up
    name: "↥ Up"
    optimistic: true
    turn_on_action:
      lambda: |-
        id(the_desk).desk().push_button(ufo_desk::Button::up);
    turn_off_action:
      lambda: |-
        id(the_desk).desk().release_button();
  - platform: template
    id: switch_down
    name: "↧ Down"
    optimistic: true
    turn_on_action:
      lambda: |-
        id(the_desk).desk().push_button(ufo_desk::Button::down);
    turn_off_action:
      lambda: |-
        id(the_desk).desk().release_button();

script:
  # Central command selector: choose the single code to stream to the desk
  # from all physical button states. UP+DOWN held = calibrate once armed,
  # or stop while still arming; otherwise the highest-priority single button.
  - id: apply_buttons
    then:
      - lambda: |-
          auto &desk = id(the_desk).desk();
          bool u = id(btn_up).state;
          bool d = id(btn_down).state;
          if (u && d && id(calibrating)) {
            desk.push_button(ufo_desk::Button::calibrate);
          } else if (u && d) {
            desk.release_button();
          } else if (u) {
            desk.push_button(ufo_desk::Button::up);
          } else if (d) {
            desk.push_button(ufo_desk::Button::down);
          } else if (id(btn_mem).state) {
            desk.push_button(ufo_desk::Button::mem);
          } else if (id(btn_preset1).state) {
            desk.push_button(ufo_desk::Button::preset1);
          } else if (id(btn_preset2).state) {
            desk.push_button(ufo_desk::Button::preset2);
          } else {
            desk.release_button();
          }
  # Calibration arms only after UP and DOWN are held together for 10s.
  - id: calibrate_arm
    mode: restart
    then:
      - delay: 10s
      - lambda: |-
          if (id(btn_up).state && id(btn_down).state) {
            id(calibrating) = true;
          }
      - script.execute: apply_buttons

packages:
  gpio_btn_mem: !include
    file: gpio_btn.yaml
    vars:
      name: "GPIO btn mem"
      pin: "D1"
      sensor_id: btn_mem
  gpio_btn_up: !include
    file: gpio_btn.yaml
    vars:
      name: "GPIO btn up"
      pin: "D2"
      sensor_id: btn_up
  gpio_btn_down: !include
    file: gpio_btn.yaml
    vars:
      name: "GPIO btn down"
      pin: "D3"
      sensor_id: btn_down
  gpio_btn_preset1: !include
    file: gpio_btn.yaml
    vars:
      name: "GPIO btn preset1"
      pin: "D4"
      sensor_id: btn_preset1
  gpio_btn_preset2: !include
    file: gpio_btn.yaml
    vars:
      name: "GPIO btn preset2"
      pin: "D7"
      sensor_id: btn_preset2

# D1 D2 D3 D4(led) D7

uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 57600


#
# Display stuff
#

i2c:
  sda: D5
  scl: D6
  frequency: 400kHz

font:
  - file: "gfonts://Roboto"
    id: desk_font
    size: 14

display:
  - platform: ssd1306_i2c
    id: desk_display
    model: "SSD1306 128x64"
    lambda: |-
      auto d = id(the_desk).desk();
      it.printf(0, 0, id(desk_font), "H:%d", d.cur_height_mm());
      it.printf(64, 0, id(desk_font), "MH:%d", d.stored_height_mm());
      it.printf(0, 16, id(desk_font), "%s", d.position_status_str().c_str());
      it.printf(0, 32, id(desk_font), "E:%02d", d.error_code());
      if (d.programming_mode()) {
        it.printf(0, 48, id(desk_font), "SET");
      }
